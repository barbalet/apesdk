<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRA · Procedural Residential Architecture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101915;color:#e9eee5;font:15px system-ui}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#839b9f,#c7cdb7)}header{position:absolute;left:28px;top:22px;max-width:510px;background:#10231edc;padding:20px 24px;border:1px solid #9ea88b55;border-radius:12px}h1{font-size:26px;letter-spacing:.12em;margin:0 0 4px}p{color:#becab9;margin:4px 0 16px;line-height:1.5}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:9px 0}button,input{font:inherit;border:1px solid #9ea88b77;border-radius:5px;background:#213b31;color:inherit;padding:7px}input[type=number]{width:120px}button{cursor:pointer}label{display:flex;align-items:center;gap:5px}footer{position:absolute;bottom:24px;left:28px;padding:12px 18px;background:#10231edc;border-radius:8px;color:#d1dbc7}#error{color:#ffc0a0}a{color:#d4e6c0}
</style>
<canvas id="view" aria-label="PRA generated house and yard"></canvas>
<header><h1>PRA</h1><p>Procedural Residential Architecture<br>Original Urban layouts · standalone C / WebAssembly</p>
<div class="row"><label>Seed <input id="seed" type="number" min="0" max="4294967295" value="372114642"></label><button id="generate">Generate</button></div>
<div class="row"><label><input type="checkbox" id="roof" checked>Roof</label><label><input type="checkbox" id="doors">Open doors</label><button id="walk">Walk inside</button><button id="download">Export JSON</button></div>
<p id="stats">Loading C module…</p><span id="error" role="alert"></span></header>
<footer id="help">Drag to orbit · Scroll to zoom · Remove roof to inspect rooms</footer>
<script src="pra.js"></script><script>
'use strict';
(async()=>{
const M=await PRA(),canvas=document.getElementById('view'),gl=canvas.getContext('webgl2');if(!gl)throw Error('WebGL2 unavailable');
const $=id=>document.getElementById(id),compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,`#version 300 es
layout(location=0) in vec3 p;layout(location=1) in vec3 n;layout(location=2) in vec3 color;uniform mat4 vp;out vec3 c;out float distanceToCamera;void main(){gl_Position=vp*vec4(p,1);c=color*(.40+.60*max(dot(n,normalize(vec3(-.4,1,.3))),0.));distanceToCamera=gl_Position.w;}`));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec3 c;in float distanceToCamera;out vec4 pixel;void main(){vec3 lit=mix(c,vec3(.56,.65,.62),clamp(distanceToCamera/360.,0.,.55));pixel=vec4(pow(lit,vec3(1./2.2)),1);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const vpLocation=gl.getUniformLocation(program,'vp'),buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
for(let i=0;i<3;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,i*12);}gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.56,.65,.62,1);
let vertices=0,scene,angle=.7,elevation=.68,distance=65,walking=false,player=[0,0],yaw=0,keys=new Set(),drag=null,last=performance.now();
const json=()=>JSON.parse(M.UTF8ToString(M._pra_demo_json()));
function upload(){const ptr=M._pra_demo_mesh(2+($('roof').checked?1:0));if(!ptr)throw Error('C mesh allocation failed');vertices=M._pra_demo_vertex_count();gl.bufferData(gl.ARRAY_BUFFER,M.HEAPF32.subarray(ptr/4,ptr/4+vertices*9),gl.STATIC_DRAW);scene=json();$('stats').textContent=`${scene.houses[0].rooms.length} rooms · ${scene.houses[0].doors.length} doors · ${(vertices/3).toLocaleString()} triangles`;}
function generate(){const n=Number($('seed').value);if(!Number.isInteger(n)||n<0||n>4294967295)throw Error('Seed must be an unsigned 32-bit integer');if(!M._pra_demo_init(n&65535,n>>>16,1))throw Error('Seed cannot generate a bounded layout, or allocation failed');walking=false;$('walk').textContent='Walk inside';M._pra_demo_open_all($('doors').checked);upload();}
$('generate').onclick=()=>{try{generate();$('error').textContent='';}catch(e){$('error').textContent=e.message;}};
$('roof').onchange=upload;$('doors').onchange=()=>{M._pra_demo_open_all($('doors').checked);upload();};
$('walk').onclick=()=>{walking=!walking;if(walking){const d=scene.houses[0].doors[0];player=d.center.map(x=>x*1.5);yaw=Math.atan2(-player[0],-player[1]);}$('walk').textContent=walking?'Orbit view':'Walk inside';$('help').textContent=walking?'WASD to walk · Arrow keys or drag to look · E toggles nearest door':'Drag to orbit · Scroll to zoom · Remove roof to inspect rooms';};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(json(),null,2)],{type:'application/json'}));a.download='pra-scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];if(walking)yaw-=dx*.006;else{angle-=dx*.006;elevation=Math.max(.10,Math.min(1.5,elevation+dy*.006));}};
canvas.onwheel=e=>{e.preventDefault();distance=Math.max(12,Math.min(180,distance*Math.exp(e.deltaY*.001)));};
window.onkeydown=e=>{if(e.target.tagName==='INPUT')return;keys.add(e.code);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE'&&walking&&!e.repeat){M._pra_demo_toggle(...player);upload();}};window.onkeyup=e=>keys.delete(e.code);window.onblur=()=>{keys.clear();drag=null;};
const sub=(a,b)=>a.map((v,i)=>v-b[i]),norm=a=>{const n=Math.hypot(...a);return a.map(v=>v/n);},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
function matrix(eye,target){const z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x),v=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1],f=1/Math.tan(.55),near=.05,far=500,p=[f/(canvas.width/canvas.height),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0],m=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)m[c*4+r]+=p[k*4+r]*v[c*4+k];return m;}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const width=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)),height=Math.round(canvas.clientHeight*Math.min(devicePixelRatio,2));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);}let eye,target;
if(walking){yaw+=((keys.has('ArrowLeft')?1:0)-(keys.has('ArrowRight')?1:0))*dt*1.5;let forward=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),side=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),dx=(Math.sin(yaw)*forward-Math.cos(yaw)*side)*dt*2.8,dz=(Math.cos(yaw)*forward+Math.sin(yaw)*side)*dt*2.8;if(!M._pra_demo_blocked(player[0]+dx,player[1]))player[0]+=dx;if(!M._pra_demo_blocked(player[0],player[1]+dz))player[1]+=dz;eye=[player[0],1.65,player[1]];target=[eye[0]+Math.sin(yaw),eye[1],eye[2]+Math.cos(yaw)];}else{eye=[Math.sin(angle)*Math.cos(elevation)*distance,Math.sin(elevation)*distance,Math.cos(angle)*Math.cos(elevation)*distance];target=[0,1,0];}
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(vpLocation,false,matrix(eye,target));gl.drawArrays(gl.TRIANGLES,0,vertices);requestAnimationFrame(frame);}
generate();window.praDemo={module:M,json,vertexCount:()=>vertices};requestAnimationFrame(frame);window.addEventListener('pagehide',()=>M._pra_demo_destroy(),{once:true});
})().catch(e=>document.getElementById('error').textContent=e.stack||String(e));
</script></html>
