name: ApeSDK CI

on:
  push:
  pull_request:

jobs:
  linux-c:
    name: Linux ${{ matrix.compiler }} deterministic suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build the Linux command-line product
        run: |
          CC=${{ matrix.compiler }} ./build.sh
          test -x ../simape
      - name: Run deterministic C tests
        run: CC=${{ matrix.compiler }} ./test.sh
      - name: Verify Bronze and original-engine compatibility contract
        run: CC=${{ matrix.compiler }} make -C bronze contract-test

  maccatalyst-desktop:
    name: ${{ matrix.name }} build and Swift Testing
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native macOS
            project: maccatalyst/maccatalyst.xcodeproj
            scheme: sim-mac
            destination: platform=macOS
          - name: Mac Catalyst
            project: maccatalyst/maccatalyst.xcodeproj
            scheme: ApeSim-MacCatalyst
            destination: platform=macOS,variant=Mac Catalyst
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.name }}
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

  bronze-maccatalyst:
    name: Bronze Catalyst ${{ matrix.configuration }} and bundled scenarios
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Build without a development team or signing override
        run: |
          xcodebuild -project toolchains/bronze-mac/bronze-mac.xcodeproj \
            -scheme bronze-mac -configuration "${{ matrix.configuration }}" \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/bronze-derived" build
      - name: Verify real packaged resources and scenario controller
        run: |
          bash bronze/scenario/test_bundle.sh \
            "$RUNNER_TEMP/bronze-derived/Build/Products/${{ matrix.configuration }}-maccatalyst/BronzeSim.app"

  # Native Urban requires the separately supplied original Urban source tree.
  # Validate it locally as documented in README.md; do not use a stand-in renderer.
  apple-reference-builds:
    name: macOS reference toolchain builds
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: toolchains/war-mac/war-mac.xcodeproj
            scheme: war-mac
          - project: toolchains/planet/planet.xcodeproj
            scheme: planet
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.scheme }}
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
